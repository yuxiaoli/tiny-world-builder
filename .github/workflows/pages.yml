name: Deploy static content to Pages

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: |
          sed -i 's/\r$//' scripts/publish.sh
          bash scripts/publish.sh
        env:
          GITHUB_PAGES: "true"
      - name: Install browser for boot smoke
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify Pages editor boots
        run: |
          mkdir -p "$RUNNER_TEMP/pages-smoke"
          ln -s "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/pages-smoke/tiny-world-builder"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages-smoke" >/tmp/pages-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/tiny-world-builder/ >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke:boot
          BOOT_PATH='/tiny-world-builder/?world=data/world.snowy_village.json' EXPECT_WORLD_FIXTURE='data/world.snowy_village.json' npm run smoke:boot
        env:
          BASE_URL: http://127.0.0.1:4173
          BOOT_PATH: /tiny-world-builder/
          BOOT_TIMEOUT_MS: 90000
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
